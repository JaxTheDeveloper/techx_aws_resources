<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocHub — AI Document Hub</title>
<style>
  :root {
    --accent: #d97706;          /* DocHub = amber */
    --accent-light: #fef3c7;
    --accent-dark: #92400e;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
    --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 1px 2px rgba(15, 23, 42, .04);
    --shadow-lg: 0 10px 30px -10px rgba(15, 23, 42, .15);
    --radius: 12px;
    --radius-sm: 8px;
    --success: #059669;
    --error: #dc2626;
    --warn: #d97706;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px; line-height: 1.55;
    color: var(--text); background: var(--bg); min-height: 100vh;
  }
  .topbar {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: white;
    padding: 1.25rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    gap: 2rem; flex-wrap: wrap;
    box-shadow: var(--shadow-lg);
  }
  .brand { display: flex; align-items: center; gap: 0.9rem; }
  .brand .logo {
    width: 44px; height: 44px;
    background: rgba(255, 255, 255, .18);
    border-radius: 10px;
    display: grid; place-items: center; font-size: 22px;
  }
  .brand h1 { margin: 0; font-size: 1.15rem; font-weight: 600; letter-spacing: -.01em; }
  .brand p { margin: 0; opacity: .85; font-size: 0.82rem; }
  .status-pills { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .pill {
    background: rgba(255, 255, 255, .15);
    padding: 0.25rem 0.6rem; border-radius: 100px;
    font-size: 0.72rem;
    font-family: ui-monospace, Menlo, monospace;
  }
  .pill.local { background: rgba(255, 191, 36, .35); }
  .pill.remote { background: rgba(34, 197, 94, .35); }
  .container {
    max-width: 920px; margin: 0 auto; padding: 2rem 1.5rem 4rem;
    display: grid; gap: 1.25rem;
    min-width: 0; overflow: hidden;
  }

  /* ---------- Tenant bar ---------- */
  .tenant-bar {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    box-shadow: var(--shadow);
  }
  .tenant-bar .icon {
    width: 36px; height: 36px;
    background: var(--accent-light); color: var(--accent-dark);
    border-radius: 8px;
    display: grid; place-items: center;
    font-size: 18px; flex-shrink: 0;
  }
  .tenant-bar label {
    font-size: 0.78rem; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; display: block; margin-bottom: 0.15rem;
  }
  .tenant-bar select, .tenant-bar input {
    padding: 0.4rem 0.7rem; border: 1px solid var(--border);
    border-radius: var(--radius-sm); font: inherit; min-width: 160px;
    background: white;
  }
  .tenant-bar select:focus, .tenant-bar input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(217, 119, 6, .12);
  }
  .tenant-bar .note { color: var(--muted); font-size: 0.78rem; margin-left: auto; }
  .tenant-badge {
    display: inline-block;
    background: var(--accent-light); color: var(--accent-dark);
    padding: 0.15rem 0.6rem; border-radius: 100px;
    font-size: 0.78rem; font-weight: 500;
  }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.5rem;
    box-shadow: var(--shadow);
  }
  .card-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 1rem; gap: 1rem;
  }
  .card-header h2 { margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; }
  .card-header .step {
    background: var(--accent-light); color: var(--accent-dark);
    width: 26px; height: 26px; border-radius: 100px;
    display: inline-grid; place-items: center;
    font-size: 0.78rem; font-weight: 600; margin-right: 0.6rem;
  }
  .card-header .meta { color: var(--muted); font-size: 0.82rem; }

  /* ---------- Drop zone ---------- */
  .drop {
    border: 2px dashed var(--border); border-radius: var(--radius-sm);
    padding: 2rem 1.5rem; text-align: center;
    transition: all .15s ease; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 140px; background: #fafafa;
  }
  .drop:hover, .drop.dragover { border-color: var(--accent); background: var(--accent-light); }
  .drop svg { width: 38px; height: 38px; color: var(--muted); margin-bottom: 0.75rem; flex-shrink: 0; }
  .drop p { margin: 0.2rem 0; color: var(--muted); font-size: 0.92rem; line-height: 1.5; }
  .drop strong { color: var(--text); }
  .drop .browse { color: var(--accent); font-weight: 500; text-decoration: underline; cursor: pointer; }
  .drop input { display: none; }
  .upload-row { display: flex; gap: 0.7rem; align-items: center; margin-top: 0.8rem; }
  .upload-row label { font-size: 0.82rem; color: var(--muted); }
  .upload-row select { padding: 0.4rem 0.7rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font: inherit; }

  input[type=text] {
    flex: 1; padding: 0.6rem 0.85rem;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font: inherit; color: var(--text); background: white;
  }
  input[type=text]:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(217, 119, 6, .12);
  }
  .input-row { display: flex; gap: 0.6rem; }
  button {
    font: inherit; border: 0; border-radius: var(--radius-sm);
    padding: 0.6rem 1.1rem; cursor: pointer; font-weight: 500;
    transition: background .15s, transform .05s;
  }
  button.primary { background: var(--accent); color: white; }
  button.primary:hover { background: var(--accent-dark); }
  button.primary:disabled { background: var(--muted); cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  button.ghost:hover { background: var(--accent-light); border-color: var(--accent); }

  /* ---------- Answer + citations ---------- */
  .answer-card {
    margin-top: 1rem; padding: 1.1rem;
    background: linear-gradient(180deg, var(--accent-light) 0%, white 100%);
    border-radius: var(--radius-sm); border-left: 3px solid var(--accent);
    display: none;
  }
  .answer-card.visible { display: block; }
  .answer-text { white-space: pre-wrap; font-size: 0.94rem; color: var(--text); }
  .citations { margin-top: 1rem; }
  .citation {
    background: white; border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 0.7rem 0.9rem;
    margin-top: 0.5rem; font-size: 0.82rem;
  }
  .citation .head {
    display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
    margin-bottom: 0.3rem; color: var(--muted); font-size: 0.74rem;
  }
  .citation .head .filename { font-weight: 500; color: var(--text); }
  .citation .score {
    background: var(--accent-light); color: var(--accent-dark);
    padding: 0.1rem 0.45rem; border-radius: 100px; font-weight: 500;
  }
  .citation .doc-type-pill {
    background: #ede9fe; color: #6d28d9;
    padding: 0.1rem 0.45rem; border-radius: 100px; font-weight: 500;
  }
  .citation .head {
    flex-wrap: wrap;
  }
  .citation .head .filename {
    word-break: break-all;
    min-width: 0;
    flex: 1;
  }
  .citation .head span:last-child {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap;
  }
  .citation .body {
    font-size: 0.82rem; color: var(--muted); line-height: 1.5;
    word-break: break-word; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
    max-height: 4.5em;
  }

  /* ---------- Doc list ---------- */
  .hidden { display: none; }
  .doc-list { display: grid; gap: 0.5rem; }
  .doc-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.7rem 0.9rem; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: white; font-size: 0.88rem;
    transition: border-color .15s;
  }
  .doc-item:hover { border-color: var(--accent); }
  .doc-item .name { font-weight: 500; }
  .doc-item .meta-row { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.2rem; }
  .doc-item .meta { color: var(--muted); font-size: 0.76rem; font-family: ui-monospace, Menlo, monospace; }

  .empty { text-align: center; color: var(--muted); padding: 1.5rem; font-size: 0.9rem; }
  .muted { color: var(--muted); }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--accent-light); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toasts { position: fixed; top: 1rem; right: 1rem; z-index: 1000; display: grid; gap: 0.5rem; }
  .toast {
    background: white; border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-sm); padding: 0.7rem 1rem;
    box-shadow: var(--shadow-lg);
    min-width: 220px; max-width: 340px; font-size: 0.88rem;
    animation: slidein .25s ease-out;
  }
  .toast.success { border-left-color: var(--success); }
  .toast.error { border-left-color: var(--error); }
  .toast.warn { border-left-color: var(--warn); }
  @keyframes slidein { from { transform: translateX(120%); } to { transform: translateX(0); } }

  details {
    font-size: 0.85rem;
    min-width: 0; overflow: hidden;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0.75rem 1rem;
  }
  details > summary { cursor: pointer; color: var(--muted); padding: 0.3rem 0; user-select: none; }
  details pre {
    background: #0f172a; color: #e2e8f0; padding: 0.8rem;
    border-radius: var(--radius-sm); font-size: 0.78rem;
    overflow-x: hidden; overflow-y: auto;
    max-height: 260px;
    font-family: ui-monospace, Menlo, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    margin: 0.6rem 0 0;
    width: 100%; box-sizing: border-box;
  }
  @media (max-width: 640px) {
    .topbar { padding: 1rem; }
    .container { padding: 1rem; }
    .tenant-bar { flex-direction: column; align-items: flex-start; }
    .tenant-bar .note { margin-left: 0; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🗂️</span>
    <div>
      <h1>DocHub</h1>
      <p>Multi-tenant document Q&amp;A — every tenant only sees their own docs</p>
    </div>
  </div>
  <div class="status-pills" id="status-pills">
    <span class="pill"><span class="spinner" style="border-color:rgba(255,255,255,.3);border-top-color:white;"></span> loading…</span>
  </div>
</header>

<main class="container">

  <div class="tenant-bar">
    <div class="icon">🏢</div>
    <div>
      <label>Active tenant</label>
      <select id="tenant" onchange="refresh()" disabled></select>
    </div>
    <div id="user-info" style="display:none;">
      <label>User</label>
      <span id="username" style="font-weight:500;"></span>
      <span class="tenant-badge" id="jwt-tenant" style="margin-left:0.4rem;"></span>
    </div>
    <button id="login-btn" class="primary" onclick="login()" style="margin-left:auto;">Login</button>
    <button id="logout-btn" class="ghost" onclick="logout()" style="margin-left:auto;display:none;">Logout</button>
  </div>

  <section class="card">
    <div class="card-header">
      <h2><span class="step">1</span>Upload document</h2>
      <span class="meta">→ <span class="tenant-badge" id="upload-tenant-badge">tenant-acme</span></span>
    </div>
    <label class="drop" id="drop">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 7.5m0 0L7.5 12M12 7.5v9"/>
      </svg>
      <p><strong>Drag a contract here</strong> or <span class="browse">click to browse</span></p>
      <p style="font-size:0.78rem;">Try a sample from <code>sample_data/</code></p>
      <input type="file" id="file" accept=".pdf,.txt,.md">
    </label>
    <div class="upload-row">
      <label>Document type:</label>
      <select id="doctype">
        <option value="contract">contract</option>
        <option value="agreement">agreement</option>
        <option value="license">license</option>
        <option value="nda">nda</option>
        <option value="policy">policy</option>
        <option value="report">report</option>
        <option value="addendum">addendum</option>
        <option value="general" selected>general</option>
      </select>
    </div>
    <div id="upload-result"></div>
  </section>

  <section class="card">
    <div class="card-header">
      <h2><span class="step">2</span>Ask a question</h2>
      <span class="meta">Scoped to <span class="tenant-badge" id="query-tenant-badge">tenant-acme</span></span>
    </div>
    <div class="input-row">
      <input type="text" id="question" placeholder="e.g. What is the termination notice period?" autocomplete="off">
      <button class="primary" id="ask-btn" onclick="ask()">Ask</button>
    </div>
    <div class="answer-card" id="answer-card">
      <div class="answer-text" id="answer-text"></div>
      <div class="citations" id="citations"></div>
    </div>
  </section>

  <section class="card">
    <div class="card-header">
      <h2><span class="step">3</span>Tenant documents</h2>
      <button class="ghost" onclick="loadDocs()">Refresh</button>
    </div>
    <div class="doc-list" id="docs"><div class="empty">No documents yet.</div></div>
  </section>

  <details>
    <summary>Raw API responses (debug)</summary>
    <pre id="debug-log">No requests yet.</pre>
  </details>

</main>

<div class="toasts" id="toasts"></div>

<script>
// Direct API URL — only used on localhost. Production uses /api via CloudFront (same origin, no CORS).
const API_GATEWAY_URL = 'https://kzbe7d5fye.execute-api.us-west-2.amazonaws.com';

const API_BASE = (() => {
  const override = new URLSearchParams(location.search).get('api');
  if (override) return override.replace(/\/$/, '');
  if (window.API_BASE) return String(window.API_BASE).replace(/\/$/, '');
  if (/localhost|127\.0\.0\.1/.test(location.hostname) && API_GATEWAY_URL) {
    return API_GATEWAY_URL.replace(/\/$/, '');
  }
  return window.location.origin + '/api';
})().replace(/\/$/, '');

// ---- Cognito config ----
const COGNITO_DOMAIN = 'dochub-w7-399434941001.auth.us-west-2.amazoncognito.com';
const COGNITO_CLIENT_ID = '6m3gf24c7ouho1qp20k20cjp7n';
const REDIRECT_URI = window.location.origin + '/callback';

function formatApiError(body, status) {
  if (!body) return String(status);
  if (typeof body === 'string') return body;
  return body.detail || body.error || body.message || JSON.stringify(body);
}

function $(id) { return document.getElementById(id); }

function parseJWT(token) {
  try {
    const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(atob(base64));
  } catch { return {}; }
}

function getToken() { return localStorage.getItem('token'); }
function getClaims() {
  const t = getToken();
  return t ? parseJWT(t) : {};
}

function parseGroups(claims) {
  const groups = claims['cognito:groups'];
  if (Array.isArray(groups)) return groups.filter(Boolean);
  if (typeof groups === 'string' && groups) return groups.split(',').map(s => s.trim()).filter(Boolean);
  return [];
}

function tenant() {
  const claims = getClaims();
  const groupList = parseGroups(claims);
  if (groupList.length) {
    const selected = $('tenant').value;
    if (selected && groupList.includes(selected)) return selected;
    return groupList[0];
  }
  return $('tenant').value || 'tenant-acme';
}
function user() {
  const claims = getClaims();
  return claims['cognito:username'] || claims.sub || $('username').textContent || 'anonymous';
}

function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.style.opacity = '0', 2500);
  setTimeout(() => el.remove(), 3000);
}
function logDebug(label, data) {
  const old = $('debug-log').textContent === 'No requests yet.' ? '' : $('debug-log').textContent;
  $('debug-log').textContent = `── ${new Date().toLocaleTimeString()} — ${label} [${tenant()}] ──\n${JSON.stringify(data, null, 2)}\n\n${old}`.slice(0, 3000);
}

async function call(path, opts={}) {
  const headers = {'X-User-Id': user(), 'X-Tenant-Id': tenant()};
  const token = getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  opts.headers = Object.assign(headers, opts.headers || {});
  // Let the browser set multipart boundary for file uploads
  if (opts.body instanceof FormData) {
    delete opts.headers['Content-Type'];
  }
  const url = API_BASE + path;
  const r = await fetch(url, opts);
  const text = await r.text();
  let body;
  try { body = JSON.parse(text); } catch { body = text; }
  if (typeof body === 'string' && body.trim().startsWith('<!')) {
    body = {
      error: `API returned HTML (HTTP ${r.status}). POST uploads may be blocked by WAF, or CloudFront /api routing failed.`,
      url: url,
    };
    logDebug(`${opts.method || 'GET'} ${path} [HTML ERROR]`, body);
    return { ok: false, status: r.status, body };
  }
  logDebug(`${opts.method || 'GET'} ${path}`, body);
  return {ok: r.ok, status: r.status, body};
}

// ---- Cognito login / callback ----
async function exchangeCode(code) {
  try {
    const res = await fetch('https://' + COGNITO_DOMAIN + '/oauth2/token', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        grant_type: 'authorization_code',
        client_id: COGNITO_CLIENT_ID,
        code: code,
        redirect_uri: REDIRECT_URI,
      }),
    });
    const data = await res.json();
    if (data.id_token) {
      localStorage.setItem('token', data.id_token);
    }
  } catch (e) {
    console.error('Token exchange failed', e);
  }
  window.history.replaceState({}, '', '/');
  applyAuth();
}

function login() {
  // Managed login uses /oauth2/authorize — /login shows the classic Hosted UI
  const url = 'https://' + COGNITO_DOMAIN + '/oauth2/authorize?' + new URLSearchParams({
    client_id: COGNITO_CLIENT_ID,
    response_type: 'code',
    scope: 'openid email profile',
    redirect_uri: REDIRECT_URI,
  });
  window.location.href = url;
}

function logout() {
  localStorage.removeItem('token');
  applyAuth();
}

function applyAuth() {
  const token = getToken();
  const claims = token ? parseJWT(token) : {};

  $('login-btn').style.display = token ? 'none' : '';
  $('logout-btn').style.display = token ? '' : 'none';
  $('user-info').style.display = token ? '' : 'none';

  const select = $('tenant');
  if (token) {
    $('username').textContent = claims['cognito:username'] || claims.sub || 'unknown';
    const groupList = parseGroups(claims);
    select.innerHTML = '';
    if (groupList.length) {
      select.disabled = false;
      groupList.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.textContent = g;
        select.appendChild(opt);
      });
      select.value = groupList[0];
      $('jwt-tenant').textContent = groupList.length > 1 ? `${groupList.length} tenants` : groupList[0];
    } else {
      select.disabled = true;
      select.innerHTML = '<option value="tenant-acme">tenant-acme</option>';
      select.value = 'tenant-acme';
      $('jwt-tenant').textContent = 'no-tenant';
    }
  } else {
    select.disabled = true;
  }

  syncTenantBadges();
  $('answer-card').classList.remove('visible');
}

// ---- On page load: check for callback code ----
(function() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (code) {
    exchangeCode(code);
  } else {
    applyAuth();
  }
})();

async function loadStatus() {
  const res = await call('/health');
  if (!res.ok) { $('status-pills').innerHTML = '<span class="pill error">backend offline</span>'; return; }
  const backends = res.body.backends;
  if (backends && typeof backends === 'object') {
    $('status-pills').innerHTML = Object.entries(backends)
      .map(([k, v]) => `<span class="pill ${v === 'local' ? 'local' : 'remote'}">${k}: ${v}</span>`)
      .join('');
  } else {
    $('status-pills').innerHTML = `<span class="pill remote">${res.body.status || 'ok'}</span>`;
  }
}

function syncTenantBadges() {
  const t = tenant();
  $('upload-tenant-badge').textContent = t;
  $('query-tenant-badge').textContent = t;
}

// ---------- Upload ----------
const drop = $('drop'), fileInput = $('file');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('dragover');
  if (e.dataTransfer.files[0]) doUpload(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) doUpload(e.target.files[0]); });

async function doUpload(file) {
  $('upload-result').innerHTML = `<p class="muted" style="margin:0.8rem 0 0;"><span class="spinner"></span> Uploading ${file.name} to <strong>${tenant()}</strong>…</p>`;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('doc_type', $('doctype').value);
  const res = await call('/upload', {method: 'POST', body: fd});
  if (!res.ok) {
    toast(`Upload failed: ${formatApiError(res.body, res.status)}`, 'error');
    $('upload-result').innerHTML = `<p style="color:var(--error); margin:0.8rem 0 0;">${formatApiError(res.body, res.status)}</p>`;
    return;
  }
  const b = res.body;
  if (b.duplicate) {
    $('upload-result').innerHTML = `
      <div style="margin-top:0.8rem; padding:0.8rem; background:#fef3c7; border-radius:var(--radius-sm); border-left:3px solid var(--warn); font-size:0.88rem;">
        ⚠️ <strong>${b.filename}</strong> already exists (v${b.version || 1}) — skipped, same content.
        <div style="font-family:ui-monospace,Menlo,monospace; color:var(--muted); font-size:0.74rem; margin-top:0.25rem;">doc_id: ${b.doc_id}</div>
      </div>`;
    toast(`Duplicate — ${b.filename} already exists`, 'warn');
    loadDocs();
    return;
  }
  if (b.upload_url) {
    const putRes = await fetch(b.upload_url, {
      method: 'PUT',
      headers: {'Content-Type': file.type || 'application/pdf'},
      body: file,
    });
    if (!putRes.ok) {
      toast('S3 upload failed', 'error');
      $('upload-result').innerHTML = `<p style="color:var(--error); margin:0.8rem 0 0;">File metadata saved but S3 upload failed (${putRes.status})</p>`;
      return;
    }
  }
  const tid = b.tenant_id || tenant();
  const filename = b.filename || file.name;
  $('upload-result').innerHTML = `
    <div style="margin-top:0.8rem; padding:0.8rem; background:#fffbeb; border-radius:var(--radius-sm); border-left:3px solid var(--warn); font-size:0.88rem;">
      ✓ <strong>${filename}</strong> (${b.doc_type || $('doctype').value}) — v${b.version || 1}, ${(b.chars_extracted || 0).toLocaleString()} chars indexed under <span class="tenant-badge">${tid}</span>
      <div style="font-family:ui-monospace,Menlo,monospace; color:var(--muted); font-size:0.74rem; margin-top:0.25rem;">doc_id: ${b.doc_id || 'n/a'}</div>
    </div>`;
  toast(`Uploaded to ${tid}`, 'success');
  loadDocs();
}

// ---------- Ask ----------
async function ask() {
  const q = $('question').value.trim();
  if (!q) { toast('Type a question first', 'warn'); return; }
  $('ask-btn').disabled = true;
  $('answer-card').classList.add('visible');
  $('answer-text').innerHTML = '<span class="spinner"></span> Searching ' + tenant() + '\'s documents…';
  $('citations').innerHTML = '';
  const res = await call('/query', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({question: q}),
  });
  $('ask-btn').disabled = false;
  if (!res.ok) {
    $('answer-text').innerHTML = `<span style="color:var(--error);">${res.body.detail || 'Error'}</span>`;
    return;
  }
  $('answer-text').textContent = res.body.answer || 'No answer returned.';
  const c = res.body.citations || [];
  if (c.length) {
    let ambigHtml = '';
    if (res.body.ambiguous) {
      ambigHtml = '<div style="padding:0.5rem 0.7rem; background:#fef3c7; border-radius:var(--radius-sm); font-size:0.82rem; margin-bottom:0.5rem;">⚠️ Multiple documents had similar scores — verify the cited source.</div>';
    }
    const citationHtml = c.map(x => {
      if (typeof x === 'string') {
        return `<div class="citation"><div class="body" style="font-family:ui-monospace,Menlo,monospace;font-size:0.78rem;">${x.replace(/</g, '&lt;')}</div></div>`;
      }
      return `
        <div class="citation">
          <div class="head">
            <span class="filename">${x.filename || x.doc_id} ${x.version ? `<span style="background:#fef3c7;padding:0.1rem 0.3rem;border-radius:100px;font-size:0.7rem;font-weight:500;color:#92400e;">v${x.version}</span>` : ''}</span>
            <span>
              ${x.doc_type ? `<span class="doc-type-pill">${x.doc_type}</span> ` : ''}
              ${x.created_at ? `<span class="meta">${new Date(x.created_at).toLocaleDateString()}</span> ` : ''}
              <span class="score">${((x.score || 0) * 100).toFixed(2)}%</span>
            </span>
          </div>
          <div class="body">${(x.text || '').replace(/</g, '&lt;')}</div>
        </div>`;
    }).join('');
    $('citations').innerHTML = ambigHtml + '<div class="muted" style="font-size:0.78rem; margin-top:0.6rem;">📎 Citations from ' + tenant() + '\'s documents:</div>' + citationHtml;
  } else {
    $('citations').innerHTML = '<div class="muted" style="font-size:0.82rem; margin-top:0.6rem;">No matches found in ' + tenant() + '\'s documents.</div>';
  }
}
$('question').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });

// ---------- Doc list ----------
async function loadDocs() {
  const res = await call('/docs/list');
  if (!res.ok) {
    $('docs').innerHTML = '<div class="empty" style="color:var(--error);">Could not load documents (' + res.status + '): ' + (res.body.detail || res.body.error || JSON.stringify(res.body)) + '</div>';
    return;
  }
  if (!res.body.docs || !res.body.docs.length) {
    $('docs').innerHTML = '<div class="empty">No documents under <strong>' + tenant() + '</strong> yet.</div>';
    return;
  }

  // Group by filename, sort versions descending
  const groups = {};
  for (const d of res.body.docs) {
    const key = d.filename || d.doc_id;
    if (!groups[key]) groups[key] = [];
    groups[key].push(d);
  }
  for (const key of Object.keys(groups)) {
    groups[key].sort((a, b) => (b.version || 1) - (a.version || 1));
  }

  $('docs').innerHTML = Object.entries(groups).map(([filename, versions]) => {
    const latest = versions[0];
    const hasMultiple = versions.length > 1;
    const versionsHtml = hasMultiple ? versions.slice(1).map(d => `
      <div style="display:flex; justify-content:space-between; align-items:center;
        padding:0.4rem 0.7rem; background:#f8fafc; border-radius:6px;
        font-size:0.78rem; color:var(--muted); margin-top:0.3rem;">
        <span style="font-family:ui-monospace,Menlo,monospace;">
          v${d.version || 1} — ${d.created_at ? new Date(d.created_at).toLocaleDateString() : ''}
          · ${(d.chars || 0).toLocaleString()} chars
        </span>
        <span style="font-family:ui-monospace,Menlo,monospace;">${(d.doc_id || '').slice(0, 8)}…</span>
      </div>`).join('') : '';

    return `
    <div class="doc-item" style="flex-direction:column; align-items:stretch; gap:0.4rem;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div class="name">
            ${latest.filename || latest.doc_id}
            <span style="background:#fef3c7;padding:0.1rem 0.4rem;border-radius:100px;
              font-size:0.72rem;font-weight:500;color:#92400e;">
              v${latest.version || 1} ${hasMultiple ? `<span style="color:var(--muted);font-weight:400;">(${versions.length} versions)</span>` : ''}
            </span>
          </div>
          <div class="meta-row">
            ${latest.doc_type ? `<span class="doc-type-pill" style="background:#ede9fe;color:#6d28d9;padding:0.1rem 0.5rem;border-radius:100px;font-size:0.7rem;font-weight:500;">${latest.doc_type}</span>` : ''}
            <span class="meta">${(latest.chars || 0).toLocaleString()} chars · ${latest.created_at ? new Date(latest.created_at).toLocaleDateString() : ''} · ${latest.uploaded_by || '?'}</span>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <span class="meta">${(latest.doc_id || '').slice(0, 8)}…</span>
          ${hasMultiple ? `<button class="ghost" style="font-size:0.72rem;padding:0.2rem 0.5rem;"
            onclick="this.closest('.doc-item').querySelector('.version-history').classList.toggle('hidden')">
            history
          </button>` : ''}
        </div>
      </div>
      ${hasMultiple ? `<div class="version-history hidden">${versionsHtml}</div>` : ''}
    </div>`;
  }).join('');
}

function refresh() {
  syncTenantBadges();
  loadDocsDebounced();
  $('answer-card').classList.remove('visible');
}

// Debounce to prevent spam on boot
let _docsTimer = null;
function loadDocsDebounced() { clearTimeout(_docsTimer); _docsTimer = setTimeout(loadDocs, 300); }

// Boot
loadStatus();
loadDocsDebounced();
</script>
</body>
</html>
