AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model (SAM) template describing your function.
Resources:
  dochubreingest:
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - x86_64
      CodeUri: ./src
      Description: ''
      Environment:
        Variables:
          KB_ID: X2ZTYMOW4L
          DATA_SOURCE_ID: O7DT4NSRWW
      EphemeralStorage:
        Size: 512
      Handler: trigger_kb_sync.lambda_handler
      LoggingConfig:
        LogFormat: Text
        LogGroup: /aws/lambda/dochub-reingest
      MemorySize: 128
      PackageType: Zip
      RecursiveLoop: Terminate
      Runtime: python3.12
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      SnapStart:
        ApplyOn: None
      Tags:
        Environment: hackathon
        Owner: quangphongnguyen147@gmail.com
        Project: w7capstone
        Team: g1
      Timeout: 10
      Tracing: PassThrough
      Events:
        Trigger1Event:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - Object Created
              detail:
                bucket:
                  name:
                    - dochub-docss
